<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />

    <title>KATALYX — AI-Powered Digital Transformation Advisor</title>
    <meta
      name="description"
      content="Beat the 80% digital transformation failure rate. Get an AI-powered roadmap in 30 minutes, built on frameworks proven across 50+ enterprise rollouts."
    />
    <meta name="author" content="KATALYX" />

    <!-- Open Graph (sitewide fallback; per-route values set via react-helmet-async) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KATALYX — AI-Powered Digital Transformation Advisor" />
    <meta
      property="og:description"
      content="Get an AI-powered transformation roadmap in 30 minutes. Built on frameworks proven across 50+ enterprise transformations."
    />
    <meta property="og:url" content="https://www.katalyx.io/" />
    <meta property="og:site_name" content="KATALYX" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KATALYX — AI-Powered Digital Transformation Advisor" />
    <meta
      name="twitter:description"
      content="Get an AI-powered transformation roadmap in 30 minutes. Built on frameworks proven across 50+ enterprise transformations."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://storage.googleapis.com/gpt-engineer-file-uploads/lffAcU6tnSO5OAA1ma3jpOVaApF2/uploads/1770942920931-katalyx-icon-only.svg"
    />

    <!-- Fonts: preconnect + non-blocking stylesheet -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />

    <!-- Structured data: Organization + WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "KATALYX",
            "url": "https://www.katalyx.io/",
            "logo": "https://storage.googleapis.com/gpt-engineer-file-uploads/lffAcU6tnSO5OAA1ma3jpOVaApF2/uploads/1770942920931-katalyx-icon-only.svg",
            "description": "AI-powered digital transformation advisor built on frameworks proven across enterprise transformations.",
            "email": "contact@katalyx.io"
          },
          {
            "@type": "WebSite",
            "name": "KATALYX",
            "url": "https://www.katalyx.io/",
            "description": "Get an AI-powered digital transformation roadmap in 30 minutes."
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
